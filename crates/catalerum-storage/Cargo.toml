[package]
name = "catalerum-storage"
description = "catalerum: StorageBackend trait + local / S3 / WebDAV"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.152.0", features = ["behavior-version-latest"] }
bytes = "1.12.1"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset"] }
roxmltree = "0.21.1"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
