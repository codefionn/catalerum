[package]
name = "catalerum-operator"
description = "catalerum: the Kubernetes operator that reconciles WorkspaceSandbox CRs (SOUL §20)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
catalerum-k8s = { version = "0.1.0", path = "../catalerum-k8s" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
futures = "0.3.34"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
kube = { version = "4.2.0", default-features = false, features = ["runtime", "client", "derive", "rustls-tls"] }
# kube's `rustls-tls` ships rustls WITHOUT a crypto backend (the app must pick
# one); ring builds with just a C compiler, so the slim standalone Dockerfile
# keeps working. Installed process-wide in main before the client is built.
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_32"] }
schemars = "1.2.2"
