[package]
name = "catalerum-llm"
description = "catalerum: llmleaf client — chat via the Responses API (streaming, tool-calls, agent loop), embeddings, TTS, STT"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
base64 = "0.22"
bytes = "1.11.1"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
futures = "0.3.32"
llmleaf-client = "0.2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.17"
tracing = "0.1.44"
