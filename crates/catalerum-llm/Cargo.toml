[package]
name = "catalerum-llm"
description = "catalerum: llmleaf client — chat via the Responses API (streaming, tool-calls, agent loop), embeddings, TTS, STT"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
futures = "0.3.34"
llmleaf-client = "0.5.0"
# llmleaf-client 0.5 exposes reqwest 0.12 clients in its builder API.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
tracing = "0.1.44"
