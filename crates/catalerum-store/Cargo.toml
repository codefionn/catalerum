[package]
name = "catalerum-store"
description = "catalerum: Postgres via sqlx — migrations, repositories (source of truth)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Compile-time storage selection. PostgreSQL remains the default when this
# feature is absent; the all-in-one binary enables `sqlite` and gets a fully
# monomorphised SqlitePool repository stack (no per-query runtime dispatch).
sqlite = []

[dependencies]
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "macros", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
