[package]
name = "catalerum-backup"
description = "catalerum: disaster-recovery backup + restore — Postgres logical dump + object blobs → an S3 / WebDAV / local destination (SOUL §30)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
catalerum-bus = { version = "0.1.0", path = "../catalerum-bus" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
catalerum-storage = { version = "0.1.0", path = "../catalerum-storage" }
catalerum-store = { version = "0.1.0", path = "../catalerum-store" }
tempfile = "3.27.0"
uuid = { version = "1.27.0", features = ["v4"] }
