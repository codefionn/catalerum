[package]
name = "catalerum-ingest"
description = "catalerum: sync orchestration — pull, normalize, store, enqueue"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
catalerum-automation = { version = "0.1.0", path = "../catalerum-automation" }
# Valkey distributed lock for the scheduler's single-fire guard (SOUL §11/§6.2).
catalerum-bus = { version = "0.1.0", path = "../catalerum-bus" }
catalerum-calendar = { version = "0.1.0", path = "../catalerum-calendar" }
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
catalerum-email = { version = "0.1.0", path = "../catalerum-email" }
# Convert stored HTML objects to readable Markdown before indexing (SOUL §10/§27),
# so search sees the text — not the tags/scripts/styles — of an `.html` file.
catalerum-fetch = { version = "0.1.0", path = "../catalerum-fetch" }
catalerum-graph = { version = "0.1.0", path = "../catalerum-graph" }
# The safe Datalog query language the `GraphQuery` poller parses + evaluates
# in-process over a workspace's loaded facts (SOUL §6.3/§18).
catalerum-logic = { version = "0.1.0", path = "../catalerum-logic" }
# Build an object's StorageBackend from its connection (per-object backend
# resolution in the object-ingest worker, SOUL §9) + exercise the real read path.
catalerum-storage = { version = "0.1.0", path = "../catalerum-storage" }
catalerum-store = { version = "0.1.0", path = "../catalerum-store" }
catalerum-vector = { version = "0.1.0", path = "../catalerum-vector" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
# NFC-fold entity names in the dedup key so composed/decomposed accents don't
# mint two entities (SOUL §29 entity dedup; already in-tree transitively).
unicode-normalization = "0.1.25"
uuid = { version = "1.23.3", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3.16.0"
# The real CodeRunner (Boa JS), to drive Code/Condition graph nodes end-to-end
# through the worker (SOUL §11 Phase B).
catalerum-script = { version = "0.1.0", path = "../catalerum-script" }
# Used only by the reconciler integration test to back-date a job's lease
# (`locked_at`) so the stale-reclaim path can be exercised without sleeping.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }
