[package]
name = "catalerum-email"
description = "catalerum: EmailProvider trait impls + local Maildir / IMAP / JMAP (read-only ingest)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
base64 = "0.23.1"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
mailparse = "0.18.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["fs", "rt", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
uuid = { version = "1.27.0", features = ["v4", "v5"] }
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
