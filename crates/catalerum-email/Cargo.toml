[package]
name = "catalerum-email"
description = "catalerum: EmailProvider trait impls + local Maildir / IMAP / JMAP (read-only ingest)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.89"
base64 = "0.22"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
mailparse = "0.16.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["fs", "rt", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.41"
uuid = { version = "1.23.3", features = ["v4", "v5"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.24.0"
tokio = { version = "1.52.3", features = ["full"] }
