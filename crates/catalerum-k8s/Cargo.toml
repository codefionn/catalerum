[package]
name = "catalerum-k8s"
description = "catalerum: the WorkspaceSandbox CRD types, shared by the operator and the API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
kube = { version = "2.0.1", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.26.1", default-features = false }
schemars = "1"

[features]
# k8s-openapi refuses to build without a version feature; binaries select exactly
# one. This lets `cargo check -p catalerum-k8s` (and `cargo test`) succeed standalone.
check = ["k8s-openapi/latest"]
