[package]
name = "catalerum-calendar"
description = "catalerum: CalendarProvider trait + local(ics) / CalDAV / Google"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
icalendar = { version = "0.17.14", default-features = false, features = ["parser", "chrono-tz"] }
notify = "9.0.0-rc.5"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["fs", "sync", "rt", "macros", "time"] }
uuid = { version = "1.27.0", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
