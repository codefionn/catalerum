[package]
name = "catalerum-bus"
description = "catalerum: Valkey pub/sub token relay, Streams work bus, locks, HA coord"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
futures = "0.3.32"
redis = { version = "1.2.2", features = ["tokio-comp", "aio", "connection-manager", "streams"] }
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
