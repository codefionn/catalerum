[package]
name = "catalerum-bus"
description = "catalerum: Valkey pub/sub token relay, Streams work bus, locks, HA coord"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
futures = "0.3.34"
redis = { version = "1.7.1", features = ["tokio-comp", "aio", "connection-manager", "streams"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
