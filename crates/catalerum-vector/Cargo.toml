[package]
name = "catalerum-vector"
description = "catalerum: Qdrant collections, embeddings upsert, filtered ANN search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full"] }
