[package]
name = "catalerum-graph"
description = "catalerum: Neo4j projection writers and Cypher queries"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
# Only for the drift-guard test that pins the logic crate's LABELS/EDGE_TYPES to
# this crate's NodeLabel/EdgeType enums — not a runtime dependency.
catalerum-logic = { version = "0.1.0", path = "../catalerum-logic" }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.3", features = ["v4"] }
