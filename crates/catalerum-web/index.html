<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- URL of the Markdown worker's loader script. The post_build hook in
         Trunk.toml (inject-md-worker.sh) writes the loader and fills this in. -->
    <meta name="catalerum-md-worker" content="__CATALERUM_MD_WORKER__" />
    <title>catalerum</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="rust" href="../catalerum-markdown-worker/Cargo.toml"
          data-type="worker" data-bindgen-target="no-modules"
          data-wasm-opt="z" />
  </head>
  <body></body>
</html>
