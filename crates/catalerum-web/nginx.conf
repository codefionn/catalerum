# Serving config for the catalerum web SPA (Trunk/wasm Leptos CSR) on
# unprivileged nginx (listens on 8080, runs as uid 101). Installed as
# /etc/nginx/conf.d/default.conf by the root Dockerfile's `runtime-web` stage.
#
# The SPA calls the API under relative prefixes (/ws, /conversations, /auth,
# …see Trunk.toml); in the cluster the ingress routes those to the catalerum
# API service and everything else here. This container proxies nothing.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # wasm compresses ~3x and nginx only gzips text/html by default.
    gzip on;
    gzip_types application/wasm application/javascript text/css;
    gzip_min_length 1024;

    # Client-side routes have no file behind them — fall back to the app
    # shell. Trunk fingerprints every asset it emits, so a filesystem miss is
    # (almost) always a route.
    location / {
        try_files $uri /index.html;
    }

    # The shell must revalidate so a new deploy is picked up on reload…
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # …while fingerprinted assets are immutable.
    location ~* \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
