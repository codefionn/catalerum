[package]
name = "catalerum-mcp"
description = "catalerum: MCP server (scoped tools/resources/prompts) + client of external MCP servers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
catalerum-core = { version = "0.1.0", path = "../catalerum-core" }
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "io-std", "macros", "process", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread"] }
