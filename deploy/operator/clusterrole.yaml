# Least-privilege cluster role for the operator. It manages namespaces cluster-
# wide (one per workspace) plus the namespaced children, and CRUDs the
# WorkspaceSandbox CR + status. The CRD itself is installed via manifest (deploy/
# crd), NOT by the operator, so it needs no customresourcedefinitions verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalerum-operator
rules:
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The operator only ever *creates* this narrow pods/exec Role for the API, so it
  # must itself hold those verbs to be allowed to grant (bind) them.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["catalerum.dev"]
    resources: ["workspacesandboxes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["catalerum.dev"]
    resources: ["workspacesandboxes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["catalerum.dev"]
    resources: ["workspacesandboxes/finalizers"]
    verbs: ["update"]
